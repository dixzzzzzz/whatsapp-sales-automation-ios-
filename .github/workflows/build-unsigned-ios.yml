name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project files
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "No project ZIP found in repository root"
            exit 1
          fi
          unzip -q "${ZIP_FILE}"
          test -f ios-native/WhatsAppSalesAutomation.xcodeproj/project.pbxproj
          test -f ios-native/WhatsAppSalesAutomation/ViewController.swift

      - name: Build unsigned native iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios-native/WhatsAppSalesAutomation.xcodeproj \
            -scheme WhatsAppSalesAutomation \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios-native/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="ios-native/build/Build/Products/Release-iphoneos/WhatsAppSalesAutomation.app"
          test -d "${APP_PATH}"
          rm -rf Payload ios-native/WhatsAppSalesAutomation-unsigned.ipa
          mkdir Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry ios-native/WhatsAppSalesAutomation-unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-sales-automation-unsigned-ipa
          path: ios-native/WhatsAppSalesAutomation-unsigned.ipa
          if-no-files-found: error
